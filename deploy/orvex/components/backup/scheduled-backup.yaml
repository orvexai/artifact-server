apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: artifact-server-db-daily
  namespace: artifact-server
spec:
  schedule: "0 0 12 * * *"
  backupOwnerReference: self
  cluster:
    name: artifact-server-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
