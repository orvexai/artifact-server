# Rehearsal gets only internal app and database values. The bucket credentials come from its OBC.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: artifact-server-runtime
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: orvex-secrets
    kind: SecretStore
  target:
    name: artifact-server-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: api-token
      remoteRef:
        key: artifact-server-rehearsal/app-secret
        property: api-token
    - secretKey: database-url
      remoteRef:
        key: artifact-server-rehearsal/postgres
        property: database-url
    - secretKey: embed-binding-secret
      remoteRef:
        key: artifact-server-rehearsal/app-secret
        property: embed-binding-secret
