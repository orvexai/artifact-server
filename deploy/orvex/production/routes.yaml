# DNS remains on today's cluster until the move; these routes are reachable only through
# the Manchester gateway when the host header is supplied by Bring-up.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: artifact-server
  labels:
    app.kubernetes.io/name: artifact-server
    app.kubernetes.io/component: ingress
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: platform-gateway
      namespace: traefik
      sectionName: orvex-ai-https
  hostnames:
    - artifacts.orvex.ai
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: artifact-server
          port: 80
          weight: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: artifact-server-content
  labels:
    app.kubernetes.io/name: artifact-server
    app.kubernetes.io/component: ingress
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: platform-gateway
      namespace: traefik
      sectionName: houston-artifacts-https
  hostnames:
    - "*.houstonartifacts.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: artifact-server
          port: 80
          weight: 1
