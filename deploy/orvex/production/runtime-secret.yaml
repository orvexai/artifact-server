# Runtime values are sourced only from the namespace's own OpenBao paths (MA-09 / C1-4).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: artifact-server-runtime
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: orvex-secrets
    kind: SecretStore
  target:
    name: artifact-server-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: api-token
      remoteRef:
        key: artifact-server/app-secret
        property: api-token
    - secretKey: database-url
      remoteRef:
        key: artifact-server/postgres
        property: database-url
    - secretKey: s3-access-key-id
      remoteRef:
        key: artifact-server/app-secret
        property: s3-access-key-id
    - secretKey: s3-secret-access-key
      remoteRef:
        key: artifact-server/app-secret
        property: s3-secret-access-key
    - secretKey: oidc-directory-client-secret
      remoteRef:
        key: artifact-server/oidc
        property: oidc-directory-client-secret
    - secretKey: bootstrap-admin-email
      remoteRef:
        key: artifact-server/oidc
        property: bootstrap-admin-email
    - secretKey: embed-binding-secret
      remoteRef:
        key: artifact-server/app-secret
        property: embed-binding-secret
