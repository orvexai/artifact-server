              value: "http://$(BUCKET_HOST):$(BUCKET_PORT)"
            - name: ARTIFACT_SERVER_OIDC_CLIENT_ID
              value: "artifact-server-rehearsal"
            - name: ARTIFACT_SERVER_OIDC_ISSUER
              value: "https://auth.eu-central-1.myidp.cloud/realms/my-idp"
          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 3
            timeoutSeconds: 1
            failureThreshold: 2
          resources:
